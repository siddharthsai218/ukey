<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="50%" stop-color="#0E121A" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Emerald / Cyan Key Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
  </defs>

  <!-- Container Frame -->
  <rect width="840" height="220" rx="16" fill="url(#bgGrad)" stroke="#1F2430" stroke-width="1.5"/>

  <!-- Subtle grid lines in background -->
  <path d="M 0 55 L 840 55 M 0 110 L 840 110 M 0 165 L 840 165" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1"/>
  <path d="M 210 0 L 210 220 M 420 0 L 420 220 M 630 0 L 630 220" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Logo Icon: Modern Hardware Key + Biometric Crest -->
  <g transform="translate(68, 46)">
    <!-- Ambient glow behind icon -->
    <circle cx="64" cy="64" r="54" fill="#10B981" opacity="0.15" filter="url(#glow)"/>

    <!-- Outer Rounded Hexagon / Shield -->
    <rect x="12" y="12" width="104" height="104" rx="26" fill="#121620" stroke="url(#brandGrad)" stroke-width="2.5"/>

    <!-- Key & Padlock Icon with Biometric Arcs -->
    <g transform="translate(36, 32)">
      <!-- Key Shackle -->
      <path d="M 16 28 L 16 16 C 16 7.16 23.16 0 32 0 C 40.84 0 48 7.16 48 16 L 48 28" fill="none" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Body -->
      <rect x="4" y="26" width="56" height="42" rx="10" fill="#181D2A" stroke="url(#brandGrad)" stroke-width="2.5"/>
      <!-- Biometric Core (Fingerprint ridges inside lock) -->
      <path d="M 24 47 C 24 43 27 39 32 39 C 37 39 40 43 40 47" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 20 54 C 20 46 25 43 32 43 C 39 43 44 46 44 54" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
      <circle cx="32" cy="53" r="2.5" fill="#06B6D4"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(224, 78)">
    <!-- Wordmark -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="url(#textGrad)">
      u<tspan fill="url(#brandGrad)">Key</tspan>
    </text>

    <!-- Version Badge -->
    <g transform="translate(142, 6)">
      <rect width="64" height="24" rx="6" fill="#181E29" stroke="#283244" stroke-width="1"/>
      <text x="32" y="16.5" font-family="'JetBrains Mono', 'Geist Mono', monospace" font-size="11" font-weight="700" fill="#22C55E" text-anchor="middle">v0.1.0</text>
    </g>

    <!-- Tagline -->
    <text x="2" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="18" font-weight="600" fill="#9CA3AF" letter-spacing="-0.3">
      Native Touch ID for Linux using your Android phone’s hardware enclave.
    </text>

    <!-- Technical Badges Strip -->
    <g transform="translate(2, 84)">
      <!-- Pill 1: Linux /dev/uhid -->
      <rect x="0" y="0" width="124" height="22" rx="4" fill="#131722" stroke="#222B3D" stroke-width="1"/>
      <circle cx="10" cy="11" r="3.5" fill="#22C55E"/>
      <text x="20" y="15" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#E5E7EB">Linux /dev/uhid</text>

      <!-- Pill 2: Android StrongBox -->
      <rect x="134" y="0" width="144" height="22" rx="4" fill="#131722" stroke="#222B3D" stroke-width="1"/>
      <circle cx="144" cy="11" r="3.5" fill="#10B981"/>
      <text x="154" y="15" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#E5E7EB">StrongBox (EAL5+)</text>

      <!-- Pill 3: FIDO2 / CTAP2 -->
      <rect x="288" y="0" width="112" height="22" rx="4" fill="#131722" stroke="#222B3D" stroke-width="1"/>
      <circle cx="298" cy="11" r="3.5" fill="#06B6D4"/>
      <text x="308" y="15" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#E5E7EB">FIDO2 / CTAP2</text>

      <!-- Pill 4: Zero Cloud -->
      <rect x="410" y="0" width="94" height="22" rx="4" fill="#131722" stroke="#222B3D" stroke-width="1"/>
      <circle cx="420" cy="11" r="3.5" fill="#A855F7"/>
      <text x="430" y="15" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#E5E7EB">100% Local</text>
    </g>
  </g>
</svg>
